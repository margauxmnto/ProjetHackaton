// Fichier: app/build.gradle (Module: app)

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.echosentinel'
    // Compiler avec une version récente (ex: 34)
    compileSdk 34

    defaultConfig {
        applicationId "com.echosentinel"
        minSdk 24 // Minimum requis pour le DJI Mobile SDK v5
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Configuration Spécifique DJI Mobile SDK V5
    packagingOptions {
        // Prévention des erreurs de doublons de fichiers .jui
        exclude 'META-INF/Rx.kt'
        exclude 'META-INF/rxjava.properties'
    }
}

dependencies {
    // Dépendances de base Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // --- Dépendances DJI Mobile SDK V5 (Vérifiez toujours la version sur le site DJI) ---
    implementation 'com.dji:dji-sdk-v5:5.4.1'
    // Services Requis pour le Matrice 4E et l'OSDK
    implementation 'com.dji:dji-sdk-services-osdk-core:5.4.1'
    implementation 'com.dji:dji-sdk-services-flysafe:5.4.1'
    implementation 'com.dji:dji-sdk-services-msdk-core:5.4.1'

    // --- Dépendance OpenCV ---
    implementation project(':openCVLibrary')
}